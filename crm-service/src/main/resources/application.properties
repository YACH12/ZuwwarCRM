spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
server.port=8081
spring.jpa.open-in-view=false
spring.mvc.pathmatch.matching-strategy=ant_path_matcher
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/mail-inbox
smtp.gmail.username=${GMAIL_USERNAME:}
smtp.gmail.password=${GMAIL_PASSWORD:}

encryption.secret=${ENCRYPTION_SECRET}
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

app.frontend-url=http://localhost:4200
app.backend-url=http://localhost:8081
ai.service.url=http://localhost:8000

keycloak.auth-server-url=http://localhost:8080
keycloak.realm=mail-inbox
keycloak.admin-client-id=zuwwar-admin-service
keycloak.admin-client-secret=Pwz5nFlMXnJqGPwAgU9G0FCKDtpvV4ra
keycloak.expected-audience=${KEYCLOAK_EXPECTED_AUDIENCE:crm-frontend}

# Kafka
spring.kafka.bootstrap-servers=localhost:39092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties[max.block.ms]=3000
spring.kafka.producer.properties[request.timeout.ms]=3000
spring.kafka.producer.properties[delivery.timeout.ms]=6000
spring.kafka.consumer.group-id=crm-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.auto-offset-reset=earliest

logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN